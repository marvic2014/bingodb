<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo Quiz Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass-morphism { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .hidden { display: none; }
        .bingo-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
        .bingo-cell { aspect-ratio: 1/1; display: flex; align-items: center; justify-content: center; text-align: center; padding: 4px; font-size: 0.75rem; border: 1px solid #e2e8f0; cursor: pointer; transition: all 0.2s; overflow: hidden; word-break: break-word; }
        .bingo-cell.marked { background-color: #4f46e5; color: white; border-color: #4338ca; }
        .bingo-cell.free { background-color: #f1f5f9; font-weight: bold; }
        @keyframes pulse-custom {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .animate-pulse-custom { animation: pulse-custom 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans">

    <!-- Landing / Auth Section -->
    <div id="auth-section" class="min-h-screen flex items-center justify-center p-4">
        <div class="glass-morphism w-full max-w-md p-8 rounded-2xl shadow-xl bg-white border border-slate-200">
            <div class="flex justify-center mb-6">
                <div class="inline-flex rounded-lg bg-slate-100 p-1">
                    <button id="tab-teacher" class="px-4 py-2 rounded-md bg-white shadow-sm text-indigo-600 font-bold transition-all">Teacher</button>
                    <button id="tab-student" class="px-4 py-2 rounded-md text-slate-500 font-bold transition-all">Student</button>
                </div>
            </div>

            <div id="teacher-auth-ui">
                <h2 id="auth-title" class="text-2xl font-bold text-center text-gray-800 mb-2">Teacher Login</h2>
                <form id="login-form" class="space-y-4">
                    <input type="email" id="login-email" placeholder="Email" required class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                    <input type="password" id="login-password" placeholder="Password" required class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                    <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-lg hover:bg-indigo-700 transition-all">Login</button>
                </form>

                <form id="register-form" class="hidden space-y-4">
                    <input type="text" id="reg-lname" placeholder="Last Name" required class="w-full p-3 border rounded-lg">
                    <input type="text" id="reg-subject" placeholder="Subject" required class="w-full p-3 border rounded-lg">
                    <input type="email" id="reg-email" placeholder="Email" required class="w-full p-3 border rounded-lg">
                    <input type="password" id="reg-password" placeholder="Password" required class="w-full p-3 border rounded-lg">
                    <button type="submit" class="w-full bg-emerald-600 text-white font-bold py-3 rounded-lg">Register</button>
                </form>
                
                <button id="toggle-auth" class="w-full mt-4 text-indigo-600 text-sm hover:underline">New teacher? Register here</button>
            </div>

            <div id="student-join-ui" class="hidden">
                <h2 class="text-2xl font-bold text-center text-gray-800 mb-2">Join Bingo Game</h2>
                <form id="student-form" class="space-y-4">
                    <input type="text" id="stu-name" placeholder="Your Name" required class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-orange-500 outline-none">
                    <input type="text" id="stu-code" placeholder="6-Digit Game Code" maxlength="6" required class="w-full p-3 border rounded-lg text-center text-2xl tracking-widest font-mono focus:ring-2 focus:ring-orange-500 outline-none">
                    <button type="submit" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-4 rounded-xl text-lg shadow-lg">Join Game</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Teacher Dashboard -->
    <div id="teacher-dashboard" class="hidden p-4 md:p-8 max-w-6xl mx-auto">
        <header class="flex justify-between items-center mb-8 bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <div>
                <h1 class="text-2xl font-bold text-gray-800">Bingo Management</h1>
                <p id="welcome-msg" class="text-slate-500 italic">Connected to Bingo Cloud</p>
            </div>
            <button id="logout-btn" class="text-red-500 font-bold hover:bg-red-50 px-4 py-2 rounded-lg transition-all">Logout</button>
        </header>

        <!-- View: Collections List -->
        <div id="view-collections">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold text-slate-700">Your Collections</h2>
                <button onclick="openColModal()" class="bg-indigo-600 text-white px-4 py-2 rounded-lg font-bold hover:bg-indigo-700">+ New Collection</button>
            </div>
            <div id="collections-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </div>

        <!-- View: Questions Inside Collection -->
        <div id="view-questions" class="hidden">
            <div class="flex items-center justify-between mb-6">
                <div class="flex items-center gap-4">
                    <button onclick="backToCollections()" class="text-indigo-600 font-bold hover:underline">← Back</button>
                    <h2 id="active-col-title" class="text-xl font-bold text-slate-800">Questions</h2>
                </div>
                <div class="flex gap-2">
                    <button onclick="document.getElementById('csv-input').click()" class="bg-slate-100 text-slate-600 px-4 py-2 rounded-lg text-sm font-bold">CSV Import</button>
                    <input type="file" id="csv-input" class="hidden" accept=".csv">
                    <button onclick="openQuestionModal()" class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-bold">+ Add Question</button>
                </div>
            </div>
            <div id="questions-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
        </div>
    </div>

    <!-- Student Bingo Game -->
    <div id="student-game" class="hidden p-4 min-h-screen flex flex-col items-center">
        <div class="w-full max-w-lg">
            <div class="bg-white p-6 rounded-2xl shadow-xl mb-6 text-center">
                <h2 class="text-xl font-bold text-gray-800" id="game-title">Bingo Game</h2>
                <p class="text-indigo-600 font-bold" id="player-display"></p>
            </div>
            <div class="bg-white p-2 rounded-xl shadow-lg border-4 border-indigo-100 mb-6">
                <div id="bingo-card" class="bingo-grid"></div>
            </div>
            <button onclick="checkBingo()" class="w-full py-4 bg-green-500 text-white font-black rounded-2xl text-xl shadow-lg hover:bg-green-600">BINGO!</button>
        </div>
    </div>

    <!-- Modals -->
    <!-- SUCCESS/CODE MODAL (Replacing the broken alert) -->
    <div id="code-modal" class="fixed inset-0 bg-black/80 hidden items-center justify-center p-4 z-[100]">
        <div class="bg-white p-8 rounded-3xl w-full max-w-md shadow-2xl text-center">
            <div class="w-20 h-20 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-4">
                <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
            </div>
            <h2 class="text-2xl font-bold text-slate-800 mb-2">Game is Live!</h2>
            <p class="text-slate-500 mb-6">Share this code with your students:</p>
            <div id="display-game-code" class="text-6xl font-black tracking-widest text-indigo-600 bg-slate-50 p-6 rounded-2xl border-2 border-dashed border-indigo-200 mb-8 font-mono">000000</div>
            <button onclick="closeCodeModal()" class="w-full bg-slate-900 text-white py-4 rounded-xl font-bold text-lg">Go to Dashboard</button>
        </div>
    </div>

    <div id="col-modal" class="fixed inset-0 bg-black/60 hidden items-center justify-center p-4 z-50">
        <div class="bg-white p-6 rounded-2xl w-full max-w-sm">
            <h2 class="text-xl font-bold mb-4">New Collection</h2>
            <input type="text" id="new-col-name" placeholder="Collection Name" class="w-full p-3 border rounded-lg mb-4">
            <div class="flex gap-2">
                <button onclick="saveCollection()" class="flex-1 bg-indigo-600 text-white py-2 rounded-lg font-bold">Create</button>
                <button onclick="closeColModal()" class="flex-1 bg-slate-100 py-2 rounded-lg">Cancel</button>
            </div>
        </div>
    </div>

    <div id="question-modal" class="fixed inset-0 bg-black/60 hidden items-center justify-center p-4 z-50">
        <div class="bg-white p-6 rounded-2xl w-full max-w-lg shadow-2xl">
            <h2 id="q-modal-title" class="text-xl font-bold mb-4">Add Question</h2>
            <form id="question-form" class="space-y-4">
                <input type="hidden" id="q-id">
                <textarea id="q-text" required placeholder="Question description..." class="w-full p-3 border rounded-lg h-24 focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
                <div class="grid grid-cols-2 gap-2">
                    <input type="text" id="q-opt-a" placeholder="Answer A" required class="p-3 border rounded-lg">
                    <input type="text" id="q-opt-b" placeholder="Answer B" required class="p-3 border rounded-lg">
                    <input type="text" id="q-opt-c" placeholder="Answer C" required class="p-3 border rounded-lg">
                    <input type="text" id="q-opt-d" placeholder="Answer D" required class="p-3 border rounded-lg">
                </div>
                <select id="q-correct" class="w-full p-3 border rounded-lg">
                    <option value="A">Correct Answer: A</option>
                    <option value="B">Correct Answer: B</option>
                    <option value="C">Correct Answer: C</option>
                    <option value="D">Correct Answer: D</option>
                </select>
                <div class="flex gap-2">
                    <button type="submit" class="flex-1 bg-indigo-600 text-white py-2 rounded-lg font-bold">Save</button>
                    <button type="button" onclick="closeQuestionModal()" class="flex-1 bg-slate-100 py-2 rounded-lg">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, onSnapshot, addDoc, deleteDoc, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCN7gtZAYAPEnO9MSP3ZzogJIWjXaQLaL0",
            authDomain: "bingo-a2a02.firebaseapp.com",
            projectId: "bingo-a2a02",
            storageBucket: "bingo-a2a02.firebasestorage.app",
            messagingSenderId: "682450259652",
            appId: "1:682450259652:web:dbf508eb53aae341c04391"
        };

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'bingo-system-001';
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let user = null;
        let collectionsList = [];
        let questionsList = [];
        let activeColId = null;
        let qUnsubscribe = null;

        // AUTH UI TABS
        document.getElementById('tab-teacher').onclick = () => {
            document.getElementById('teacher-auth-ui').classList.remove('hidden');
            document.getElementById('student-join-ui').classList.add('hidden');
            document.getElementById('tab-teacher').classList.add('bg-white', 'shadow-sm', 'text-indigo-600');
            document.getElementById('tab-student').classList.remove('bg-white', 'shadow-sm', 'text-indigo-600');
        };
        document.getElementById('tab-student').onclick = () => {
            document.getElementById('teacher-auth-ui').classList.add('hidden');
            document.getElementById('student-join-ui').classList.remove('hidden');
            document.getElementById('tab-student').classList.add('bg-white', 'shadow-sm', 'text-indigo-600');
            document.getElementById('tab-teacher').classList.remove('bg-white', 'shadow-sm', 'text-indigo-600');
        };

        // AUTH OBSERVER
        onAuthStateChanged(auth, async (u) => {
            user = u;
            if (u && !u.isAnonymous) {
                document.getElementById('auth-section').classList.add('hidden');
                document.getElementById('teacher-dashboard').classList.remove('hidden');
                loadTeacherData();
            } else if (!u) {
                document.getElementById('auth-section').classList.remove('hidden');
                document.getElementById('teacher-dashboard').classList.add('hidden');
            }
        });

        document.getElementById('login-form').onsubmit = async (e) => {
            e.preventDefault();
            try { 
                await signInWithEmailAndPassword(auth, document.getElementById('login-email').value, document.getElementById('login-password').value); 
            } catch (err) { alert("Login failed. Please check credentials."); }
        };

        document.getElementById('register-form').onsubmit = async (e) => {
            e.preventDefault();
            try {
                await createUserWithEmailAndPassword(auth, document.getElementById('reg-email').value, document.getElementById('reg-password').value);
            } catch (err) { alert("Registration failed."); }
        };

        document.getElementById('logout-btn').onclick = () => signOut(auth);

        // TEACHER: COLLECTIONS
        function loadTeacherData() {
            const colRef = collection(db, 'artifacts', appId, 'users', user.uid, 'collections');
            onSnapshot(colRef, (snap) => {
                collectionsList = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                renderCollections();
            });
        }

        window.openColModal = () => document.getElementById('col-modal').classList.replace('hidden', 'flex');
        window.closeColModal = () => document.getElementById('col-modal').classList.replace('flex', 'hidden');
        window.closeCodeModal = () => document.getElementById('code-modal').classList.replace('flex', 'hidden');

        window.saveCollection = async () => {
            const name = document.getElementById('new-col-name').value;
            if (!name) return;
            await addDoc(collection(db, 'artifacts', appId, 'users', user.uid, 'collections'), {
                name, createdAt: new Date().toISOString()
            });
            closeColModal();
            document.getElementById('new-col-name').value = '';
        };

        function renderCollections() {
            const grid = document.getElementById('collections-grid');
            grid.innerHTML = collectionsList.map(c => `
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                    <h3 class="text-xl font-bold mb-4 text-slate-800">${c.name}</h3>
                    <div class="space-y-2">
                        <button onclick="launchGame('${c.id}', '${c.name}')" class="w-full bg-orange-500 text-white py-3 rounded-xl font-bold hover:bg-orange-600 transition-all shadow-md">🚀 Launch Live Game</button>
                        <button onclick="enterCollection('${c.id}', '${c.name}')" class="w-full bg-slate-100 text-slate-700 py-2 rounded-xl font-bold hover:bg-slate-200 transition-all">Questions</button>
                        <button onclick="deleteCol('${c.id}')" class="w-full text-red-400 text-xs mt-2 hover:underline">Delete</button>
                    </div>
                </div>
            `).join('');
        }

        window.deleteCol = async (id) => {
            if(confirm("Permanently delete collection?")) {
                await deleteDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'collections', id));
            }
        };

        // TEACHER: QUESTIONS
        window.enterCollection = (id, name) => {
            activeColId = id;
            document.getElementById('active-col-title').textContent = name;
            document.getElementById('view-collections').classList.add('hidden');
            document.getElementById('view-questions').classList.remove('hidden');
            syncQuestions(id);
        };

        window.backToCollections = () => {
            if (qUnsubscribe) qUnsubscribe();
            document.getElementById('view-collections').classList.remove('hidden');
            document.getElementById('view-questions').classList.add('hidden');
        };

        function syncQuestions(colId) {
            const qRef = collection(db, 'artifacts', appId, 'users', user.uid, 'collections', colId, 'questions');
            qUnsubscribe = onSnapshot(qRef, (snap) => {
                questionsList = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                renderQuestions();
            });
        }

        window.openQuestionModal = (qId = null) => {
            document.getElementById('q-id').value = qId || '';
            document.getElementById('question-modal').classList.replace('hidden', 'flex');
            if (!qId) document.getElementById('question-form').reset();
        };

        window.closeQuestionModal = () => document.getElementById('question-modal').classList.replace('flex', 'hidden');

        document.getElementById('question-form').onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('q-id').value;
            const data = {
                text: document.getElementById('q-text').value,
                optA: document.getElementById('q-opt-a').value,
                optB: document.getElementById('q-opt-b').value,
                optC: document.getElementById('q-opt-c').value,
                optD: document.getElementById('q-opt-d').value,
                correct: document.getElementById('q-correct').value
            };
            if (id) await updateDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'collections', activeColId, 'questions', id), data);
            else await addDoc(collection(db, 'artifacts', appId, 'users', user.uid, 'collections', activeColId, 'questions'), data);
            closeQuestionModal();
        };

        function renderQuestions() {
            const grid = document.getElementById('questions-grid');
            grid.innerHTML = questionsList.map(q => `
                <div class="bg-white p-4 rounded-xl border border-slate-200">
                    <p class="font-bold text-slate-800 mb-2">${q.text}</p>
                    <div class="text-xs text-slate-500 mb-2">Ans: ${q.correct} (${q['opt'+q.correct]})</div>
                    <div class="flex gap-2">
                        <button onclick="editQ('${q.id}')" class="text-indigo-600 text-xs font-bold">Edit</button>
                        <button onclick="deleteQ('${q.id}')" class="text-red-500 text-xs font-bold">Delete</button>
                    </div>
                </div>
            `).join('');
        }

        window.editQ = (id) => {
            const q = questionsList.find(x => x.id === id);
            document.getElementById('q-id').value = q.id;
            document.getElementById('q-text').value = q.text;
            document.getElementById('q-opt-a').value = q.optA;
            document.getElementById('q-opt-b').value = q.optB;
            document.getElementById('q-opt-c').value = q.optC;
            document.getElementById('q-opt-d').value = q.optD;
            document.getElementById('q-correct').value = q.correct;
            openQuestionModal(id);
        };

        window.deleteQ = async (id) => {
            await deleteDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'collections', activeColId, 'questions', id));
        };

        // LAUNCH GAME LOGIC
        window.launchGame = async (colId, colName) => {
            try {
                const code = Math.floor(100000 + Math.random() * 900000).toString();
                
                // Save session to public database
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'sessions', code), {
                    teacherId: user.uid,
                    collectionId: colId,
                    title: colName,
                    code: code,
                    status: 'active',
                    launchedAt: new Date().toISOString()
                });

                // Display code in custom modal (Not using alert)
                document.getElementById('display-game-code').textContent = code;
                document.getElementById('code-modal').classList.replace('hidden', 'flex');
                
            } catch (error) {
                console.error("Launch error:", error);
                alert("Failed to launch game. Check internet connection.");
            }
        };

        // STUDENT JOIN
        document.getElementById('student-form').onsubmit = async (e) => {
            e.preventDefault();
            const name = document.getElementById('stu-name').value;
            const code = document.getElementById('stu-code').value;

            const sessSnap = await getDoc(doc(db, 'artifacts', appId, 'public', 'data', 'sessions', code));
            if (!sessSnap.exists()) {
                alert("Invalid code. Ask your teacher for the current code.");
                return;
            }
            
            const sessionData = sessSnap.data();
            await signInAnonymously(auth);
            
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('student-game').classList.remove('hidden');
            document.getElementById('game-title').textContent = sessionData.title;
            document.getElementById('player-display').textContent = `Player: ${name}`;
            
            loadBingoAnswers(sessionData.teacherId, sessionData.collectionId);
        };

        async function loadBingoAnswers(tId, cId) {
            const qRef = collection(db, 'artifacts', appId, 'users', tId, 'collections', cId, 'questions');
            onSnapshot(qRef, (snap) => {
                const allAnswers = [];
                snap.forEach(doc => {
                    const d = doc.data();
                    // Put all options into the pool
                    allAnswers.push(d.optA, d.optB, d.optC, d.optD);
                });
                generateBingoCard(allAnswers);
            });
        }

        function generateBingoCard(pool) {
            const cardGrid = document.getElementById('bingo-card');
            cardGrid.innerHTML = '';
            const finalPool = pool.length >= 24 ? pool : [...pool, ...Array(24).fill("???")];
            const shuffled = finalPool.sort(() => 0.5 - Math.random()).slice(0, 24);
            
            for (let i = 0; i < 25; i++) {
                const cell = document.createElement('div');
                cell.className = 'bingo-cell bg-white hover:bg-indigo-50 border rounded-lg p-1 text-[10px] leading-tight font-medium shadow-sm';
                if (i === 12) {
                    cell.textContent = "FREE SPACE";
                    cell.className += " marked free font-bold text-indigo-600";
                } else {
                    cell.textContent = shuffled.pop();
                    cell.onclick = () => cell.classList.toggle('marked');
                }
                cardGrid.appendChild(cell);
            }
        }

        window.checkBingo = () => {
            const cells = document.querySelectorAll('.bingo-cell.marked');
            if (cells.length >= 5) alert("BINGO submitted to teacher!");
            else alert("Keep marking squares!");
        };

    </script>
</body>
</html>
