<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bingo Quiz Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass-morphism { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .hidden { display: none; }
        .bingo-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
        .bingo-cell { aspect-ratio: 1/1; display: flex; align-items: center; justify-content: center; text-align: center; padding: 4px; font-size: 0.75rem; border: 1px solid #e2e8f0; cursor: pointer; transition: all 0.2s; overflow: hidden; word-break: break-word; }
        .bingo-cell.marked { background-color: #4f46e5; color: white; border-color: #4338ca; }
        .bingo-cell.free { background-color: #f1f5f9; font-weight: bold; }
        .bingo-header { aspect-ratio: 1/1; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 1.25rem; color: #4f46e5; background: #eef2ff; border-radius: 8px; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans">

    <!-- Landing / Auth Section -->
    <div id="auth-section" class="min-h-screen flex items-center justify-center p-4">
        <div class="glass-morphism w-full max-w-md p-8 rounded-2xl shadow-xl bg-white border border-slate-200">
            <div class="flex justify-center mb-6">
                <div class="inline-flex rounded-lg bg-slate-100 p-1">
                    <button id="tab-teacher" class="px-4 py-2 rounded-md bg-white shadow-sm text-indigo-600 font-bold transition-all">Teacher</button>
                    <button id="tab-student" class="px-4 py-2 rounded-md text-slate-500 font-bold transition-all">Student</button>
                </div>
            </div>

            <div id="teacher-auth-ui">
                <h2 id="auth-title" class="text-2xl font-bold text-center text-gray-800 mb-2">Teacher Login</h2>
                <form id="login-form" class="space-y-4">
                    <input type="email" id="login-email" placeholder="Email" required class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                    <input type="password" id="login-password" placeholder="Password" required class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                    <button type="submit" id="btn-login" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-lg hover:bg-indigo-700 transition-all">Login</button>
                </form>
            </div>

            <div id="student-join-ui" class="hidden">
                <h2 class="text-2xl font-bold text-center text-gray-800 mb-2">Join Bingo Game</h2>
                <div id="auth-status-bar" class="text-xs text-center text-slate-400 mb-4 italic">Establishing secure connection...</div>
                <form id="student-form" class="space-y-4">
                    <input type="text" id="stu-name" placeholder="Your Name" required class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-orange-500 outline-none">
                    <input type="text" id="stu-code" placeholder="6-Digit Game Code" maxlength="6" required class="w-full p-3 border rounded-lg text-center text-2xl tracking-widest font-mono focus:ring-2 focus:ring-orange-500 outline-none">
                    <button type="submit" id="btn-student-join" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-4 rounded-xl text-lg shadow-lg">Join Game</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Teacher Dashboard -->
    <div id="teacher-dashboard" class="hidden p-4 md:p-8 max-w-6xl mx-auto">
        <header class="flex justify-between items-center mb-8 bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <div>
                <h1 class="text-2xl font-bold text-gray-800">Bingo Management</h1>
                <p id="welcome-msg" class="text-slate-500 italic">Connected to Bingo Cloud</p>
            </div>
            <button id="logout-btn" class="text-red-500 font-bold hover:bg-red-50 px-4 py-2 rounded-lg transition-all">Logout</button>
        </header>

        <!-- Active Sessions Section -->
        <div id="active-sessions-area" class="mb-8 hidden">
            <h2 class="text-xl font-bold text-slate-700 mb-4">Active Live Games</h2>
            <div id="active-sessions-list" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
        </div>

        <div id="view-collections">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold text-slate-700">Your Collections</h2>
                <button onclick="openColModal()" class="bg-indigo-600 text-white px-4 py-2 rounded-lg font-bold hover:bg-indigo-700">+ New Collection</button>
            </div>
            <div id="collections-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </div>

        <div id="view-questions" class="hidden">
            <div class="flex items-center justify-between mb-6">
                <div class="flex items-center gap-4">
                    <button onclick="backToCollections()" class="text-indigo-600 font-bold hover:underline">← Back</button>
                    <h2 id="active-col-title" class="text-xl font-bold text-slate-800">Questions</h2>
                </div>
                <div class="flex gap-2">
                    <button onclick="document.getElementById('csv-input').click()" id="btn-csv-import" class="bg-slate-100 text-slate-600 px-4 py-2 rounded-lg text-sm font-bold hover:bg-slate-200 transition-colors">CSV Import</button>
                    <input type="file" id="csv-input" class="hidden" accept=".csv">
                    <button onclick="openQuestionModal()" class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-bold hover:bg-indigo-700 transition-colors">+ Add Question</button>
                </div>
            </div>
            <div id="questions-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
        </div>
    </div>

    <!-- Student Bingo Game -->
    <div id="student-game" class="hidden p-4 min-h-screen flex flex-col items-center">
        <div class="w-full max-w-lg">
            <div class="bg-white p-6 rounded-2xl shadow-xl mb-6 flex justify-between items-center">
                <div>
                    <h2 class="text-xl font-bold text-gray-800" id="game-title">Bingo Game</h2>
                    <p class="text-indigo-600 font-bold" id="player-display"></p>
                </div>
                <button onclick="exitSession()" class="text-slate-400 text-sm hover:text-red-500 font-medium">Exit Game</button>
            </div>
            
            <div class="bg-white p-4 rounded-xl shadow-lg border-4 border-indigo-100 mb-6">
                <!-- Bingo Headers B I N G O -->
                <div class="grid grid-cols-5 gap-1 mb-2">
                    <div class="bingo-header">B</div>
                    <div class="bingo-header">I</div>
                    <div class="bingo-header">N</div>
                    <div class="bingo-header">G</div>
                    <div class="bingo-header">O</div>
                </div>
                <div id="bingo-card" class="bingo-grid"></div>
            </div>
            <button onclick="checkBingo()" class="w-full py-4 bg-green-500 text-white font-black rounded-2xl text-xl shadow-lg hover:bg-green-600">BINGO!</button>
        </div>
    </div>

    <!-- Modals -->
    <div id="code-modal" class="fixed inset-0 bg-black/80 hidden items-center justify-center p-4 z-[100]">
        <div class="bg-white p-8 rounded-3xl w-full max-w-md shadow-2xl text-center">
            <h2 class="text-2xl font-bold text-slate-800 mb-2">Game is Live!</h2>
            <div id="display-game-code" class="text-6xl font-black tracking-widest text-indigo-600 bg-slate-50 p-6 rounded-2xl border-2 border-dashed border-indigo-200 mb-8 font-mono">000000</div>
            <button onclick="closeCodeModal()" class="w-full bg-slate-900 text-white py-4 rounded-xl font-bold text-lg">Go to Dashboard</button>
        </div>
    </div>

    <div id="col-modal" class="fixed inset-0 bg-black/60 hidden items-center justify-center p-4 z-50">
        <div class="bg-white p-6 rounded-2xl w-full max-w-sm">
            <h2 class="text-xl font-bold mb-4">New Collection</h2>
            <input type="text" id="new-col-name" placeholder="Collection Name" class="w-full p-3 border rounded-lg mb-4">
            <div class="flex gap-2">
                <button onclick="saveCollection()" class="flex-1 bg-indigo-600 text-white py-2 rounded-lg font-bold">Create</button>
                <button onclick="closeColModal()" class="flex-1 bg-slate-100 py-2 rounded-lg">Cancel</button>
            </div>
        </div>
    </div>

    <div id="question-modal" class="fixed inset-0 bg-black/60 hidden items-center justify-center p-4 z-50">
        <div class="bg-white p-6 rounded-2xl w-full max-w-lg shadow-2xl">
            <h2 id="q-modal-title" class="text-xl font-bold mb-4">Add Question</h2>
            <form id="question-form" class="space-y-4">
                <textarea id="q-text" required placeholder="Question description..." class="w-full p-3 border rounded-lg h-24"></textarea>
                <div class="grid grid-cols-2 gap-2">
                    <input type="text" id="q-opt-a" placeholder="Answer A" required class="p-3 border rounded-lg">
                    <input type="text" id="q-opt-b" placeholder="Answer B" required class="p-3 border rounded-lg">
                    <input type="text" id="q-opt-c" placeholder="Answer C" required class="p-3 border rounded-lg">
                    <input type="text" id="q-opt-d" placeholder="Answer D" required class="p-3 border rounded-lg">
                </div>
                <select id="q-correct" class="w-full p-3 border rounded-lg">
                    <option value="A">A</option><option value="B">B</option><option value="C">C</option><option value="D">D</option>
                </select>
                <div class="flex gap-2">
                    <button type="submit" class="flex-1 bg-indigo-600 text-white py-2 rounded-lg font-bold">Save</button>
                    <button type="button" onclick="closeQuestionModal()" class="flex-1 bg-slate-100 py-2 rounded-lg">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, onSnapshot, addDoc, getDocs, deleteDoc, query } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCN7gtZAYAPEnO9MSP3ZzogJIWjXaQLaL0",
            authDomain: "bingo-a2a02.firebaseapp.com",
            projectId: "bingo-a2a02",
            storageBucket: "bingo-a2a02.firebasestorage.app",
            messagingSenderId: "682450259652",
            appId: "1:682450259652:web:dbf508eb53aae341c04391"
        };

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'bingo-system-001';
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let collectionsList = [];
        let questionsList = [];
        let activeColId = null;
        let qUnsubscribe = null;
        let sessionUnsubscribe = null;
        let authPromise = null;

        const initAuth = async () => {
            if (authPromise) return authPromise;
            authPromise = (async () => {
                const statusEl = document.getElementById('auth-status-bar');
                try {
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        try {
                            await signInWithCustomToken(auth, __initial_auth_token);
                            if (statusEl) statusEl.textContent = "Secure connection active.";
                            return;
                        } catch (tokenErr) { console.warn("Token mismatch fallback", tokenErr); }
                    }
                    await signInAnonymously(auth);
                    if (statusEl) statusEl.textContent = "Guest session active.";
                } catch (err) {
                    console.error("Auth Init Error:", err);
                    if (statusEl) statusEl.textContent = "Offline mode.";
                }
            })();
            return authPromise;
        };

        initAuth();

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if (user && !user.isAnonymous) {
                document.getElementById('auth-section').classList.add('hidden');
                document.getElementById('teacher-dashboard').classList.remove('hidden');
                loadTeacherData();
                listenForSessions();
            }
        });

        // --- TEACHER LOGIC ---
        document.getElementById('tab-teacher').onclick = () => {
            document.getElementById('teacher-auth-ui').classList.remove('hidden');
            document.getElementById('student-join-ui').classList.add('hidden');
            document.getElementById('tab-teacher').classList.add('bg-white', 'shadow-sm', 'text-indigo-600');
            document.getElementById('tab-student').classList.remove('bg-white', 'shadow-sm', 'text-indigo-600');
        };
        document.getElementById('tab-student').onclick = () => {
            document.getElementById('teacher-auth-ui').classList.add('hidden');
            document.getElementById('student-join-ui').classList.remove('hidden');
            document.getElementById('tab-student').classList.add('bg-white', 'shadow-sm', 'text-indigo-600');
            document.getElementById('tab-teacher').classList.remove('bg-white', 'shadow-sm', 'text-indigo-600');
        };

        document.getElementById('login-form').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-login');
            btn.disabled = true; btn.textContent = "Logging in...";
            try { 
                await signInWithEmailAndPassword(auth, document.getElementById('login-email').value, document.getElementById('login-password').value); 
            } catch (err) { 
                alert("Login failed: " + err.message); 
                btn.disabled = false; btn.textContent = "Login";
            }
        };

        document.getElementById('logout-btn').onclick = async () => {
            await signOut(auth);
            location.reload();
        };

        function loadTeacherData() {
            const colRef = collection(db, 'artifacts', appId, 'users', currentUser.uid, 'collections');
            onSnapshot(colRef, (snap) => {
                collectionsList = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                renderCollections();
            });
        }

        function listenForSessions() {
            const sessRef = collection(db, 'artifacts', appId, 'public', 'data', 'sessions');
            // RULE 2: Simulating filter in memory
            onSnapshot(sessRef, (snap) => {
                const mySessions = snap.docs
                    .map(d => ({ id: d.id, ...d.data() }))
                    .filter(s => s.teacherId === currentUser.uid);
                
                const area = document.getElementById('active-sessions-area');
                const list = document.getElementById('active-sessions-list');
                
                if (mySessions.length > 0) {
                    area.classList.remove('hidden');
                    list.innerHTML = mySessions.map(s => `
                        <div class="bg-indigo-50 border border-indigo-100 p-4 rounded-xl flex justify-between items-center">
                            <div>
                                <span class="text-xs font-bold text-indigo-400 uppercase tracking-wider">Live: ${s.id}</span>
                                <h3 class="font-bold text-indigo-900">${s.title}</h3>
                            </div>
                            <button onclick="destroySession('${s.id}')" class="bg-red-100 text-red-600 p-2 px-3 rounded-lg text-sm font-bold hover:bg-red-200">End Game</button>
                        </div>
                    `).join('');
                } else {
                    area.classList.add('hidden');
                }
            });
        }

        window.destroySession = async (code) => {
            if (confirm("End this session? All student progress for this code will be lost.")) {
                try {
                    await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'sessions', code));
                } catch (error) {
                    console.error("Failed to end session:", error);
                    alert("Could not end the session. Please update your Firebase Rules to allow 'delete'.");
                }
            }
        };

        function renderCollections() {
            const grid = document.getElementById('collections-grid');
            grid.innerHTML = collectionsList.map(c => `
                <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                    <h3 class="text-xl font-bold mb-4 text-slate-800">${c.name}</h3>
                    <div class="space-y-2">
                        <button onclick="launchGame('${c.id}', '${c.name}')" class="w-full bg-orange-500 text-white py-3 rounded-xl font-bold hover:bg-orange-600 transition-colors">🚀 Launch Game</button>
                        <button onclick="enterCollection('${c.id}', '${c.name}')" class="w-full bg-slate-50 text-slate-600 py-2 rounded-xl hover:bg-slate-100 font-medium">Edit Questions</button>
                    </div>
                </div>
            `).join('');
        }

        window.enterCollection = (id, name) => {
            activeColId = id;
            document.getElementById('active-col-title').textContent = name;
            document.getElementById('view-collections').classList.add('hidden');
            document.getElementById('view-questions').classList.remove('hidden');
            syncQuestions(id);
        };

        window.backToCollections = () => {
            if (qUnsubscribe) qUnsubscribe();
            document.getElementById('view-collections').classList.remove('hidden');
            document.getElementById('view-questions').classList.add('hidden');
        };

        function syncQuestions(colId) {
            const qRef = collection(db, 'artifacts', appId, 'users', currentUser.uid, 'collections', colId, 'questions');
            qUnsubscribe = onSnapshot(qRef, (snap) => {
                questionsList = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                const grid = document.getElementById('questions-grid');
                grid.innerHTML = questionsList.map(q => `
                    <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                        <p class="font-bold text-slate-800 mb-2">${q.text}</p>
                        <div class="grid grid-cols-2 gap-2 text-xs text-slate-500">
                            <div class="p-1 rounded bg-slate-50">A: ${q.optA}</div>
                            <div class="p-1 rounded bg-slate-50">B: ${q.optB}</div>
                            <div class="p-1 rounded bg-slate-50">C: ${q.optC}</div>
                            <div class="p-1 rounded bg-slate-50">D: ${q.optD}</div>
                        </div>
                    </div>
                `).join('');
            });
        }

        window.saveCollection = async () => {
            const name = document.getElementById('new-col-name').value;
            if (!name || !currentUser) return;
            await addDoc(collection(db, 'artifacts', appId, 'users', currentUser.uid, 'collections'), { name, createdAt: new Date().toISOString() });
            closeColModal();
            document.getElementById('new-col-name').value = '';
        };

        window.launchGame = async (colId, colName) => {
            const qSnap = await getDocs(collection(db, 'artifacts', appId, 'users', currentUser.uid, 'collections', colId, 'questions'));
            let allTerms = [];
            qSnap.forEach(doc => {
                const q = doc.data();
                if(q.optA) allTerms.push(q.optA);
                if(q.optB) allTerms.push(q.optB);
                if(q.optC) allTerms.push(q.optC);
                if(q.optD) allTerms.push(q.optD);
            });

            const code = Math.floor(100000 + Math.random() * 900000).toString();
            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'sessions', code), {
                teacherId: currentUser.uid, 
                collectionId: colId, 
                title: colName, 
                status: 'active',
                terms: allTerms 
            });
            document.getElementById('display-game-code').textContent = code;
            document.getElementById('code-modal').classList.replace('hidden', 'flex');
        };

        // --- CSV IMPORT LOGIC ---
        document.getElementById('csv-input').onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;

            if (!activeColId) {
                alert("Please select or open a collection first.");
                e.target.value = '';
                return;
            }

            const reader = new FileReader();
            reader.onload = async (ev) => {
                const rows = ev.target.result.split('\n');
                let importCount = 0;
                
                const importBtn = document.getElementById('btn-csv-import');
                const originalText = importBtn.textContent;
                importBtn.textContent = "Importing...";
                importBtn.disabled = true;

                for (let r of rows) {
                    const c = r.split(',').map(x => x.trim());
                    // Skip empty rows and ensure enough columns
                    if (c.length >= 6 && c[0] !== '') {
                        try {
                            await addDoc(collection(db, 'artifacts', appId, 'users', currentUser.uid, 'collections', activeColId, 'questions'), {
                                text: c[0],
                                optA: c[1],
                                optB: c[2],
                                optC: c[3],
                                optD: c[4],
                                correct: c[5].toUpperCase()
                            });
                            importCount++;
                        } catch (err) {
                            console.error("Error importing row:", err);
                        }
                    }
                }
                
                importBtn.textContent = originalText;
                importBtn.disabled = false;
                e.target.value = ''; 
                
                alert(`Successfully imported ${importCount} questions!`);
            };
            
            reader.readAsText(file);
        };

        // --- STUDENT LOGIC ---
        document.getElementById('student-form').onsubmit = async (e) => {
            e.preventDefault();
            const name = document.getElementById('stu-name').value;
            const code = document.getElementById('stu-code').value;
            const btn = document.getElementById('btn-student-join');

            btn.disabled = true; btn.textContent = "Joining...";

            try {
                await initAuth();
                const sessSnap = await getDoc(doc(db, 'artifacts', appId, 'public', 'data', 'sessions', code));
                if (!sessSnap.exists()) throw new Error("This game code is no longer active.");

                const data = sessSnap.data();
                document.getElementById('auth-section').classList.add('hidden');
                document.getElementById('student-game').classList.remove('hidden');
                document.getElementById('game-title').textContent = data.title;
                document.getElementById('player-display').textContent = `Player: ${name}`;

                // Persistence: Check if board exists for this session+name
                const storageKey = `bingo_board_${code}_${name}`;
                let savedBoard = localStorage.getItem(storageKey);
                
                if (savedBoard) {
                    renderBoardFromData(JSON.parse(savedBoard));
                } else {
                    generateBingoBoard(data.terms || [], storageKey);
                }

                // Watch session for destruction
                if (sessionUnsubscribe) sessionUnsubscribe();
                sessionUnsubscribe = onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'sessions', code), (s) => {
                    if (!s.exists()) {
                        alert("The teacher has ended this session.");
                        exitSession();
                    }
                });
            } catch (err) {
                alert(err.message);
                btn.disabled = false; btn.textContent = "Join Game";
            }
        };

        window.exitSession = () => {
            if (sessionUnsubscribe) sessionUnsubscribe();
            document.getElementById('student-game').classList.add('hidden');
            document.getElementById('auth-section').classList.remove('hidden');
            document.getElementById('btn-student-join').disabled = false;
            document.getElementById('btn-student-join').textContent = "Join Game";
        };

        function renderBoardFromData(boardItems) {
            const grid = document.getElementById('bingo-card');
            grid.innerHTML = '';
            boardItems.forEach((item, i) => {
                const cell = document.createElement('div');
                cell.className = 'bingo-cell bg-white border rounded-lg p-1 text-lg leading-tight font-bold shadow-sm hover:bg-slate-50 transition-all';
                cell.textContent = item;
                if (item === "FREE" || i === 12) {
                    cell.textContent = "FREE";
                    cell.classList.add('marked', 'free', 'text-indigo-600', 'text-sm');
                    cell.classList.remove('text-lg');
                }
                cell.onclick = () => {
                    cell.classList.toggle('marked');
                };
                grid.appendChild(cell);
            });
        }

        function generateBingoBoard(pool, storageKey) {
            // Helper to get random unique numbers in a range
            const getNumbers = (min, max, count) => {
                const nums = [];
                for (let i = min; i <= max; i++) nums.push(i);
                return nums.sort(() => 0.5 - Math.random()).slice(0, count);
            };

            // Standard Bingo ranges
            const b = getNumbers(1, 15, 5);
            const i_col = getNumbers(16, 30, 5);
            const n = getNumbers(31, 45, 5);
            const g = getNumbers(46, 60, 5);
            const o = getNumbers(61, 75, 5);

            const boardItems = [];
            
            // Build the card row by row for CSS Grid (5 columns)
            for (let row = 0; row < 5; row++) {
                boardItems.push(b[row]);
                boardItems.push(i_col[row]);
                
                if (row === 2) {
                    boardItems.push("FREE");
                } else {
                    boardItems.push(n[row]);
                }
                
                boardItems.push(g[row]);
                boardItems.push(o[row]);
            }

            // Save for persistence
            localStorage.setItem(storageKey, JSON.stringify(boardItems));
            renderBoardFromData(boardItems);
        }

        // Standard Modal/UI Handlers
        window.openColModal = () => document.getElementById('col-modal').classList.replace('hidden', 'flex');
        window.closeColModal = () => document.getElementById('col-modal').classList.replace('flex', 'hidden');
        window.closeCodeModal = () => document.getElementById('code-modal').classList.replace('flex', 'hidden');
        window.openQuestionModal = () => document.getElementById('question-modal').classList.replace('hidden', 'flex');
        window.closeQuestionModal = () => document.getElementById('question-modal').classList.replace('flex', 'hidden');
        window.checkBingo = () => alert("Submitting Bingo for verification!");

        document.getElementById('question-form').onsubmit = async (e) => {
            e.preventDefault();
            if (!activeColId || !currentUser) return;
            const qData = {
                text: document.getElementById('q-text').value,
                optA: document.getElementById('q-opt-a').value,
                optB: document.getElementById('q-opt-b').value,
                optC: document.getElementById('q-opt-c').value,
                optD: document.getElementById('q-opt-d').value,
                correct: document.getElementById('q-correct').value
            };
            await addDoc(collection(db, 'artifacts', appId, 'users', currentUser.uid, 'collections', activeColId, 'questions'), qData);
            closeQuestionModal();
            e.target.reset();
        };

    </script>
</body>
</html>
